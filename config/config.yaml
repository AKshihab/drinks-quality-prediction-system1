artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_URL: https://raw.githubusercontent.com/AKshihab/dataset/main/Drinks_quality.zip
  local_data_file: artifacts/data_ingestion/data.zip
  unzip_dir: artifacts/data_ingestion

data_validation:
  root_dir: artifacts/data_validation
  unzip_data_dir: artifacts/data_ingestion/Drinks_quality.csv
  status_file: artifacts/data_validation/status.txt

data_transformation:
  root_dir: artifacts/data_transformation
  data_path: artifacts/data_ingestion/Drinks_quality.csv

model_trainer:
  root_dir: artifacts/model_trainer
  train_data_path: artifacts/data_transformation/train.csv
  model_name: model.pkl
  metadata_name: model_metadata.json
  model_display_name: Drinks Quality Classifier
  model_version: "1.0"
  target_column: quality

model_evaluation:
  root_dir: artifacts/model_evaluation
  path_of_model: artifacts/model_trainer/model.pkl
  test_data_path: artifacts/data_transformation/test.csv
  metric_file_name: artifacts/model_evaluation/scores.json
  target_column: quality
